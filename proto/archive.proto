syntax = "proto3";

package archive;

service Storage {
  rpc GetPage (PageRequest) returns (PageResponse) {}
  rpc GetChunk (PageChunkRequest) returns (PageChunkResponse) {}

}

message PageRequest {
  int64 id = 1;
}

message PageResponse {
  bool found = 1;
  int64 chunk_size = 2;
  int64 chunk_num = 3;
}

message PageChunkRequest {
  int64 id = 1;
  int64 chunk = 2;
}

message PageChunkResponse {
  int64 id = 1;
  int64 chunk = 2;
  bytes data = 3;
}


